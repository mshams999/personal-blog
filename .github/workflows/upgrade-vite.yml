name: Upgrade Vite 8

on:
  push:
    branches: [chore/upgrade-vite-8]

permissions:
  contents: write

jobs:
  upgrade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Upgrade Vite and React plugin
        run: npm install --save-dev vite@8.3.6 @vitejs/plugin-react@6.2.1
      - name: Verify production build
        run: npm run build
      - name: Commit regenerated manifest and lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git diff --cached --quiet || git commit -m "chore: upgrade Vite 8 and React plugin"
          git push

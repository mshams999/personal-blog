name: Dependency health

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend install and production build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # The current root ESLint command scans the Firebase subprojects too.
      # Until a dedicated frontend ESLint config is added, validate the app with its production build.
      - run: npm run build

  functions:
    name: Firebase Functions install and syntax check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: functions
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: functions/package-lock.json
      - run: npm ci
      # Existing Google-style lint debt is tracked separately; keep CI focused on syntax validity.
      - name: Check JavaScript syntax
        run: find . -name '*.js' -not -path './node_modules/*' -print0 | xargs -0 -n1 node --check

  mail:
    name: Mail service install and lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mail
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mail/package-lock.json
      - run: npm ci
      - run: npm run lint

version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      frontend-and-tooling:
        patterns:
          - "*"
        exclude-patterns:
          - "react"
          - "react-dom"
          - "vite"
          - "@vitejs/plugin-react"
          - "tailwindcss"
          - "firebase"
          - "firebase-admin"
          - "firebase-functions"
  - package-ecosystem: npm
    directory: /functions
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
  - package-ecosystem: npm
    directory: /mail
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
